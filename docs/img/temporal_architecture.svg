<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 472' width='760' height='472' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'><rect width='760' height='472' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8a85'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1f1f1d'>Every agent step is authorized before it runs and signed after</text><rect x='24' y='52' width='220' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='36' y='76' font-size='13' font-weight='600' fill='#1f1f1d'>Temporal server</text><text x='36' y='94' font-size='11.5' fill='#6b6b66'>history, signals, timers</text><rect x='392' y='52' width='220' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='404' y='76' font-size='13' font-weight='600' fill='#1f1f1d'>Human approver</text><text x='404' y='94' font-size='11.5' fill='#6b6b66'>approves or denies by signal</text><rect x='24' y='140' width='712' height='212' rx='8' fill='#f3f3ee' stroke='#8a8a85' stroke-width='1.25'/><text x='140' y='164' font-size='13' font-weight='600' fill='#1f1f1d'>Temporal worker, Phrouros attached</text><rect x='40' y='184' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='52' y='208' font-size='13' font-weight='600' fill='#1f1f1d'>Workflow code</text><text x='52' y='226' font-size='11.5' fill='#6b6b66'>agent loop; one step</text><text x='52' y='242' font-size='11.5' fill='#6b6b66'>per LLM or tool call</text><rect x='214' y='184' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='226' y='208' font-size='13' font-weight='600' fill='#1f1f1d'>Interceptor</text><text x='226' y='226' font-size='11.5' fill='#6b6b66'>sees every activity</text><text x='226' y='242' font-size='11.5' fill='#6b6b66'>before it runs</text><rect x='388' y='184' width='158' height='72' rx='8' fill='#2a78d6' fill-opacity='0.12' stroke='#2a78d6' stroke-width='2'/><text x='400' y='208' font-size='13' font-weight='600' fill='#1f1f1d'>Policy guard</text><text x='400' y='226' font-size='11.5' fill='#6b6b66'>deny by default</text><text x='400' y='242' font-size='11.5' fill='#6b6b66'>pause for approval</text><rect x='562' y='184' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='574' y='208' font-size='13' font-weight='600' fill='#1f1f1d'>Activity</text><text x='574' y='226' font-size='11.5' fill='#6b6b66'>the LLM or tool call</text><text x='574' y='242' font-size='11.5' fill='#6b6b66'>runs only if allowed</text><rect x='40' y='280' width='506' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='52' y='304' font-size='13' font-weight='600' fill='#1f1f1d'>Data converter and ledger client</text><text x='52' y='322' font-size='11.5' fill='#6b6b66'>hashes every activity input and output; signs intent, verdict, approval, result</text><rect x='24' y='392' width='220' height='56' rx='8' fill='#2a78d6' fill-opacity='0.12' stroke='#2a78d6' stroke-width='2'/><text x='36' y='416' font-size='13' font-weight='600' fill='#1f1f1d'>Phrouros ledger</text><text x='36' y='434' font-size='11.5' fill='#6b6b66'>append-only, signed hash chain</text><rect x='270' y='392' width='220' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='282' y='416' font-size='13' font-weight='600' fill='#1f1f1d'>Kernel sensor</text><text x='282' y='434' font-size='11.5' fill='#6b6b66'>real syscalls and sockets</text><rect x='516' y='392' width='220' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='528' y='416' font-size='13' font-weight='600' fill='#1f1f1d'>Target systems</text><text x='528' y='434' font-size='11.5' fill='#6b6b66'>pools, APIs, model endpoint</text><path d='M119 108V184' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M467 108V184' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M198 220H214' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M372 220H388' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M546 220H562' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M641 256V392' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M134 336V392' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M380 392V352' fill='none' stroke='#8a8a85' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#a)'/><path d='M270 420H244' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><text x='127' y='126' font-size='11.5' fill='#6b6b66'>tasks, history</text><text x='475' y='126' font-size='11.5' fill='#6b6b66'>approve / deny signal</text><text x='206.0' y='212' font-size='11.5' fill='#6b6b66' text-anchor='middle'>call</text><text x='380.0' y='212' font-size='11.5' fill='#6b6b66' text-anchor='middle'>ask</text><text x='554.0' y='212' font-size='11.5' fill='#6b6b66' text-anchor='middle'>run</text><text x='649.0' y='372' font-size='11.5' fill='#6b6b66'>effect</text><text x='142' y='372' font-size='11.5' fill='#6b6b66'>append</text><text x='388' y='372' font-size='11.5' fill='#6b6b66'>observes worker pid</text><text x='257' y='412' font-size='11.5' fill='#6b6b66' text-anchor='middle'>join</text></svg>