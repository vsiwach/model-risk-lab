<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 472' width='760' height='472' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'><rect width='760' height='472' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8a85'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1f1f1d'>The guard moves from the network path into the step that asks</text><text x='24' y='62' font-size='13' font-weight='600' fill='#6b6b66'>Before: a proxy in front of the tools</text><rect x='40' y='78' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='52' y='102' font-size='13' font-weight='600' fill='#1f1f1d'>Agent code</text><text x='52' y='120' font-size='11.5' fill='#6b6b66'>any loop, any stack</text><text x='52' y='136' font-size='11.5' fill='#6b6b66'>calls tools over HTTP</text><rect x='214' y='78' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='226' y='102' font-size='13' font-weight='600' fill='#1f1f1d'>Phrouros proxy</text><text x='226' y='120' font-size='11.5' fill='#6b6b66'>deny by default</text><text x='226' y='136' font-size='11.5' fill='#6b6b66'>egress allowlist</text><rect x='388' y='78' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='400' y='102' font-size='13' font-weight='600' fill='#1f1f1d'>Tools and model</text><text x='400' y='120' font-size='11.5' fill='#6b6b66'>pools, APIs, endpoint</text><text x='400' y='136' font-size='11.5' fill='#6b6b66'>through proxy only</text><rect x='562' y='78' width='158' height='104' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='574' y='102' font-size='13' font-weight='600' fill='#1f1f1d'>Gaps</text><text x='574' y='120' font-size='11.5' fill='#6b6b66'>sees bytes, not steps</text><text x='574' y='136' font-size='11.5' fill='#6b6b66'>no pause for a human</text><text x='574' y='152' font-size='11.5' fill='#6b6b66'>no replay of history</text><text x='574' y='168' font-size='11.5' fill='#6b6b66'>log is unsigned</text><rect x='214' y='174' width='158' height='56' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='226' y='198' font-size='13' font-weight='600' fill='#1f1f1d'>Process log</text><text x='226' y='216' font-size='11.5' fill='#6b6b66'>local, unsigned</text><path d='M198 114H214' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M372 114H388' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M293 150V174' fill='none' stroke='#8a8a85' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#a)'/><line x1='24' x2='736' y1='256' y2='256' stroke='#d9d9d4'/><text x='24' y='282' font-size='13' font-weight='600' fill='#6b6b66'>After: the guard inside the Temporal worker</text><rect x='40' y='296' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='52' y='320' font-size='13' font-weight='600' fill='#1f1f1d'>Temporal workflow</text><text x='52' y='338' font-size='11.5' fill='#6b6b66'>agent loop as steps</text><text x='52' y='354' font-size='11.5' fill='#6b6b66'>history, timers</text><rect x='214' y='296' width='158' height='72' rx='8' fill='#2a78d6' fill-opacity='0.12' stroke='#2a78d6' stroke-width='2'/><text x='226' y='320' font-size='13' font-weight='600' fill='#1f1f1d'>Guard interceptor</text><text x='226' y='338' font-size='11.5' fill='#6b6b66'>every activity asks</text><text x='226' y='354' font-size='11.5' fill='#6b6b66'>allow, deny, approval</text><rect x='388' y='296' width='158' height='72' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='400' y='320' font-size='13' font-weight='600' fill='#1f1f1d'>Activity</text><text x='400' y='338' font-size='11.5' fill='#6b6b66'>the LLM or tool call</text><text x='400' y='354' font-size='11.5' fill='#6b6b66'>args, result hashed</text><rect x='562' y='296' width='158' height='104' rx='8' fill='none' stroke='#8a8a85' stroke-width='1.25'/><text x='574' y='320' font-size='13' font-weight='600' fill='#1f1f1d'>Gained</text><text x='574' y='338' font-size='11.5' fill='#6b6b66'>intent, not bytes</text><text x='574' y='354' font-size='11.5' fill='#6b6b66'>approval by signal</text><text x='574' y='370' font-size='11.5' fill='#6b6b66'>replay = policy test</text><text x='574' y='386' font-size='11.5' fill='#6b6b66'>signed hash chain</text><rect x='214' y='392' width='158' height='56' rx='8' fill='#2a78d6' fill-opacity='0.12' stroke='#2a78d6' stroke-width='2'/><text x='226' y='416' font-size='13' font-weight='600' fill='#1f1f1d'>Human approver</text><text x='226' y='434' font-size='11.5' fill='#6b6b66'>approve / deny signal</text><rect x='388' y='392' width='158' height='56' rx='8' fill='#2a78d6' fill-opacity='0.12' stroke='#2a78d6' stroke-width='2'/><text x='400' y='416' font-size='13' font-weight='600' fill='#1f1f1d'>Phrouros ledger</text><text x='400' y='434' font-size='11.5' fill='#6b6b66'>append-only, signed</text><path d='M198 332H214' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M372 332H388' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M293 392V368' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/><path d='M467 368V392' fill='none' stroke='#8a8a85' stroke-width='1.25' marker-end='url(#a)'/></svg>